[package]
name = "novaseal-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace]

[dependencies]
anyhow = "1.0"
blake2b-ref = "0.3"
clap = { version = "=4.5.49", features = ["derive"] }
hex = "0.4"
k256 = { version = "0.13.4", default-features = false, features = ["schnorr"] }
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
toml = "0.8"
